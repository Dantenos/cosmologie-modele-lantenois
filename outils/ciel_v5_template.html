<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Cône d'Observation — les quatre échelles</title>
<style>

 padding:7px 10px;font:10.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#cfc8b8;
 pointer-events:none;display:none;max-width:260px}
#info b{color:#d9b96a;font-weight:normal}

 font-size:10px;color:#5f5a50;text-align:center;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><h1>Le Cône d'Observation <span style="font-size:11px;color:#6f6a5e">· quatre échelles</span></h1>
<div id="sub">Chaque angle affiché est calculé avant d'être dessiné.</div>
<div id="txt"></div></div>
<div id="panneau">
 <div class="grp"><div class="tt">filtres</div><div id="f1"></div></div>
 <div class="grp"><div class="tt">outils</div><div id="f2"></div></div>
 <div id="cpt"></div></div>
<div id="zbox"><input id="zr" type="range" min="0" max="1000" value="1000"><div id="zlab"></div></div>
<div id="bas"></div>
<div id="ech">rayon de vue<div id="echv"></div></div>
<div id="info"></div>
<div id="note">glisser pour tourner · molette pour zoomer · survoler un point pour sa ligne de visée</div>
<script>
const SN=__SN__,VD=__VD__,FR=__FR__,ISO=__ISO__,M=__MES__;
const MPC=3.0857e22,AU=1.496e11,KPC=3.0857e19,RE=6.371e6,LY=9.4607e15;
const NGP=M.ngp,GCV=M.gc,PECL=M.pecl,PCEL=[0,0,1];
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function nrm(v){const n=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/n,v[1]/n,v[2]/n]}
function crs(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
const GU=nrm(crs(NGP,[0,0,1])),GV=nrm(crs(NGP,GU));           // base du plan galactique
const EU=nrm(crs(PECL,[0,0,1])),EV=nrm(crs(PECL,EU));         // base du plan de l'ecliptique
const QU=nrm(crs(PCEL,[1,0,0])),QV=nrm(crs(PCEL,QU));         // base de l'equateur celeste
const GP=nrm([GCV[0]-dot(GCV,NGP)*NGP[0],GCV[1]-dot(GCV,NGP)*NGP[1],GCV[2]-dot(GCV,NGP)*NGP[2]]);
const GQ=nrm(crs(NGP,GP));
const PLAN=[[.387],[.723],[1],[1.524],[5.203],[9.537],[19.19],[30.07]];
const RCOS=M.dmax*1.12*MPC;
const cv=document.getElementById('c'),g=cv.getContext('2d'),EL=id=>document.getElementById(id);
let W,H,S,rx=-.32,ry=.5,vx=0,vy=.0012,drag=false,px=0,py=0;
let Rview=RCOS,Rcible=RCOS,obs=false,zmax=M.zmax,mx=-1e9,my=-1e9,hit=null;
let fS82=0,fZOA=0,fISO=0,laser=-1,tour=-1,tourT=0,intro=1,phare=false,cible=null;
const ETAPES=[["1 · Terre",2.2*RE],["2 · Système solaire",45*AU],["3 · Voie lactée",26*KPC],["4 · Sphère",RCOS]];
const T4="<b>"+M.n_sn+" supernovae</b>, "+M.n_void+" vides, "+M.n_frb+" sursauts radio. Le cône rouge est la zone d'évitement : <b>"+M.n5+" SNe</b> à |b| &lt; 5° là où l'isotropie en veut "+Math.round(M.att5)+". Le pinceau doré est <b>SDSS Stripe 82</b> : "+M.n82+" SNe, "+M.pc82+" % de l'échantillon sur "+M.aire82+" % du ciel.<span class='mono'>évitement "+M.sig10+"σ · Stripe 82 ×"+M.fac82+" · z médian "+M.zmed82+" contre "+M.zmed+"<br>géométrie fiducielle déclarée : ΛCDM plat Ω_m="+M.om+", H₀="+M.h0+" — PAS le modèle étudié</span>";
const TXT=[
 "<b>r = 0.</b> L'axe de rotation est incliné de <b>"+M.obliq+"°</b> sur le pôle de l'écliptique — angle calculé ici, pas recopié. L'anneau bleu est l'<b>équateur céleste</b> : c'est lui qui définit la déclinaison, et donc pourquoi les coordonnées du catalogue sont ancrées sur la rotation de cette planète.<span class='mono'>obliquité mesurée entre pôle céleste (0,0,1) et pôle écliptique (RA 270°, Dec +66,561°)</span>",
 "Le disque ambré est le <b>plan de l'écliptique</b> : les huit planètes tournent à plat dedans. Rayons logarithmiques, sinon Mercure et Neptune ne tiennent pas dans une image. Aucune supernova du catalogue n'est ici — la plus proche est un million de fois plus loin.<span class='mono'>rayon affiché 45 UA · orbites en rayon log</span>",
 "Le disque spiral, et le Soleil à <b>8,2 kpc</b> (≈ 26 700 années-lumière) du centre. Le point capital : le plan galactique fait <b>"+M.gal_ecl+"°</b> avec l'écliptique — angle calculé ici. C'est ce basculement de repère qui fait traverser le ciel en biais à la zone d'évitement de l'étape 4.<span class='mono'>disque 15 kpc · angle galactique-écliptique mesuré entre les deux pôles</span>",T4];
const TOUR=[
 [3,"<b>Visite 1/4 — le masque.</b> Le cône rouge marque |b| = 5° et 10°. Compte les points dedans : il n'y en a pas.<span class='mono'>0 SNe à |b|&lt;5° pour "+Math.round(M.att5)+" attendues</span>",{s82:0,zoa:0,iso:0}],
 [3,"<b>Visite 2/4 — le pinceau.</b> Le faisceau balaye SDSS Stripe 82. Un quart de l'échantillon dans une bande de 2,5° — la région même que la tension T8 accuse.<span class='mono'>"+M.n82+" SNe sur "+M.aire82+" % du ciel = ×"+M.fac82+"</span>",{s82:1,zoa:0,iso:0}],
 [3,"<b>Visite 3/4 — le nul.</b> En filigrane, 1580 directions tirées uniformément, graine fixe. Voilà ce ciel sans poussière ni stratégie de relevé.<span class='mono'>graine "+M.graine+"</span>",{s82:0,zoa:0,iso:1}],
 [3,"<b>Visite 4/4 — la profondeur.</b> Le curseur remonte le temps. Les proches sont partout, les lointains dans les pinceaux : un relevé profond coûte cher, on ne le fait pas sur tout le ciel.<span class='mono'>"+M.n_bas+" SNe à z ≤ 0,1 · z max "+M.zmax+"</span>",{s82:0,zoa:0,iso:0}]];
const TPHARE="<b>Phare Sgr A*.</b> Tu regardes le centre de notre galaxie, à b = "+M.sgr_b+"° (contrôlé, pas supposé). Dans les <b>15° autour de cette direction : "+M.n_sgr+" supernova"+(M.n_sgr>1?"s":"")+"</b>, pour "+M.att_sgr+" attendues si le ciel était isotrope.<span class='mono'>DEUX causes, à ne pas confondre : l'extinction par la poussière ET l'évitement délibéré du plan par les relevés. Écrire « la matière bloque 100 % de la lumière » serait faux.</span>";
function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;S=Math.min(W,H)*0.40}
addEventListener('resize',rs);rs();
cv.onpointerdown=e=>{drag=true;cible=null;px=e.clientX;py=e.clientY;cv.classList.add('drag')};
addEventListener('pointerup',()=>{drag=false;cv.classList.remove('drag')});
addEventListener('pointermove',e=>{mx=e.clientX*devicePixelRatio;my=e.clientY*devicePixelRatio;
 if(!drag)return;vy=(e.clientX-px)*.0022;vx=(e.clientY-py)*.0022;ry+=vy;rx+=vx;px=e.clientX;py=e.clientY});
cv.onwheel=e=>{e.preventDefault();if(!obs)Rcible=Math.max(1e6,Math.min(1e28,Rcible*Math.exp(e.deltaY*.0011)))};
function rot(x,y,z){const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
 const X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y*cx-Z*sx,Z2=y*sx+Z*cx;return[X,Y,Z2]}
const CAM=2.45,FOC=1.75;
function proj(x,y,z){const[X,Y,Z]=rot(x/Rview,y/Rview,z/Rview);
 if(obs){if(Z<0.02)return null;const s=1.15/Z,r=Math.hypot(X,Y)*s;
  if(r>2.4)return null;return[W/2+X*s*S,H/2-Y*s*S,Math.min(1.6,0.5+0.35/Z),Z]}
 const d=CAM-Z;if(d<0.06)return null;const s=FOC/d;return[W/2+X*s*S,H/2-Y*s*S,s,Z]}
function fade(a,b){const l=Math.log10(Rview);
 return Math.max(0,Math.min(1,(l-a)/0.55))*Math.max(0,Math.min(1,(b-l)/0.55))}
function anneau(rr,U,V,col,al,lw){g.beginPath();let ok=true;
 for(let i=0;i<=90;i++){const t=i/90*2*Math.PI,c=Math.cos(t),s=Math.sin(t);
  const p=proj(rr*(U[0]*c+V[0]*s),rr*(U[1]*c+V[1]*s),rr*(U[2]*c+V[2]*s));
  if(!p){ok=false;break}i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
 if(ok){g.closePath();g.globalAlpha=al;g.strokeStyle=col;g.lineWidth=(lw||1)*devicePixelRatio;g.stroke()}
 return ok}
function segment(a,b,col,al,lw){const p=proj(a[0],a[1],a[2]),q=proj(b[0],b[1],b[2]);
 if(!p||!q)return;g.globalAlpha=al;g.strokeStyle=col;g.lineWidth=(lw||1)*devicePixelRatio;
 g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
function bandeGal(rr,dg,col,al){const tb=Math.tan(dg*Math.PI/180);
 for(const sg of[1,-1]){g.beginPath();let ok=true;
  for(let i=0;i<=72;i++){const t=i/72*2*Math.PI,c=Math.cos(t),s=Math.sin(t);
   const u=[GU[0]*c+GV[0]*s,GU[1]*c+GV[1]*s,GU[2]*c+GV[2]*s];
   const v=nrm([u[0]+sg*tb*NGP[0],u[1]+sg*tb*NGP[1],u[2]+sg*tb*NGP[2]]);
   const p=proj(v[0]*rr,v[1]*rr,v[2]*rr);if(!p){ok=false;break}
   i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  if(ok){g.closePath();g.globalAlpha=al;g.strokeStyle=col;g.lineWidth=devicePixelRatio;g.stroke()}}}
function pinceau(rr,al){g.strokeStyle='#d9b96a';g.fillStyle='#d9b96a';g.lineWidth=devicePixelRatio;
 for(const[a0,a1]of[[300,360],[0,60]]){const hi=[],lo=[];
  for(let i=0;i<=24;i++){const A=(a0+(a1-a0)*i/24)*Math.PI/180;
   for(const[d,arr]of[[1.25,hi],[-1.25,lo]]){const D=d*Math.PI/180;
    arr.push([Math.cos(D)*Math.cos(A)*rr,Math.cos(D)*Math.sin(A)*rr,Math.sin(D)*rr])}}
  const all=hi.concat(lo.reverse());g.beginPath();let ok=true;
  for(let k=0;k<all.length;k++){const p=proj(all[k][0],all[k][1],all[k][2]);
   if(!p){ok=false;break}k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  if(ok){g.closePath();g.globalAlpha=al*.14;g.fill();g.globalAlpha=al*.6;g.stroke()}}}
function visible(i){const f=SN[i+3],s=f&1,bb=Math.abs(SN[i+5]);
 if(SN[i+4]>zmax)return false;
 if(fS82===1&&!s)return false;if(fS82===2&&s)return false;
 if(fZOA===1&&bb>=10)return false;if(fZOA===2&&bb<10)return false;return true}
function mollweide(u){const b=Math.asin(Math.max(-1,Math.min(1,dot(u,NGP))));
 const p=[u[0]-Math.sin(b)*NGP[0],u[1]-Math.sin(b)*NGP[1],u[2]-Math.sin(b)*NGP[2]];
 const l=Math.atan2(dot(p,GQ),dot(p,GP));
 let th=b;for(let k=0;k<6;k++){const d=(2*th+Math.sin(2*th)-Math.PI*Math.sin(b))/(2+2*Math.cos(2*th));
  th-=d;if(!isFinite(th))break}
 return[-2*Math.SQRT2/Math.PI*l*Math.cos(th),Math.SQRT2*Math.sin(th)]}
function carte(){const bw=185*devicePixelRatio,bh=bw/2,x0=W-bw-20*devicePixelRatio,y0=H-bh-64*devicePixelRatio;
 g.globalAlpha=.9;g.fillStyle='rgba(10,10,14,.82)';g.fillRect(x0-6,y0-6,bw+12,bh+12);
 g.globalAlpha=.32;g.strokeStyle='#3a352c';g.lineWidth=devicePixelRatio;
 g.beginPath();g.ellipse(x0+bw/2,y0+bh/2,bw/2,bh/2,0,0,7);g.stroke();
 g.globalAlpha=.5;g.strokeStyle='#c96a4a';g.beginPath();
 g.moveTo(x0,y0+bh/2);g.lineTo(x0+bw,y0+bh/2);g.stroke();
 for(let i=0;i<SN.length;i+=6){if(!visible(i))continue;
  const m=mollweide(nrm([SN[i],SN[i+1],SN[i+2]]));
  g.globalAlpha=(SN[i+3]&1)?.95:.45;g.fillStyle=(SN[i+3]&1)?'#d9b96a':'#cfc8b8';
  g.fillRect(x0+bw/2+m[0]*bw/2,y0+bh/2-m[1]*bh/2,1.4*devicePixelRatio,1.4*devicePixelRatio)}
 const mg=mollweide(GCV);g.globalAlpha=.95;g.fillStyle='#c96a4a';
 g.beginPath();g.arc(x0+bw/2+mg[0]*bw/2,y0+bh/2-mg[1]*bh/2,2.4*devicePixelRatio,0,7);g.fill();
 g.globalAlpha=.55;g.fillStyle='#8f8878';g.font=(9*devicePixelRatio)+'px ui-monospace,monospace';
 g.fillText('Mollweide · galactique · ● Sgr A*',x0,y0+bh+13*devicePixelRatio)}
function vise(d){const r=Math.hypot(d[0],d[2]);cible=[Math.atan2(d[1],r),Math.atan2(-d[0],d[2])]}
function fr(){requestAnimationFrame(fr);
 if(intro>0){intro-=0.011;Rcible=RCOS*(1+38*Math.max(0,intro)**3)}
 if(tour>=0){tourT+=1/60;if(tourT>7.5){tour=(tour+1)%TOUR.length;lanceTour(tour)}}
 if(cible){rx+=(cible[0]-rx)*.055;ry+=(cible[1]-ry)*.055;vx=vy=0;
  if(Math.abs(cible[0]-rx)<1e-3&&Math.abs(cible[1]-ry)<1e-3)cible=null}
 else if(!drag){vy*=.985;vx*=.985;vy+=(0.0011-vy)*.012;ry+=vy;rx+=vx}
 Rview+=(Rcible-Rview)*0.055;
 g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle='#07070a';g.fillRect(0,0,W,H);
 // ETAPE 1 — Terre, axe incline, equateur celeste
 const fT=fade(6.0,8.6);
 if(fT>0.01&&!obs){const p=proj(0,0,0);
  if(p){const r=RE/Rview*p[2]*S;
   const gr=g.createRadialGradient(p[0]-r*.35,p[1]-r*.35,r*.08,p[0],p[1],r*1.03);
   gr.addColorStop(0,'#5b93bd');gr.addColorStop(.55,'#255070');gr.addColorStop(1,'#08161f');
   g.globalAlpha=fT;g.beginPath();g.arc(p[0],p[1],Math.max(r,1.5),0,7);g.fillStyle=gr;g.fill();
   g.globalAlpha=fT*.5;g.strokeStyle='#7fd4ff';g.lineWidth=devicePixelRatio;
   g.beginPath();g.arc(p[0],p[1],Math.max(r,1.5),0,7);g.stroke()}
  anneau(RE*1.9,QU,QV,'#7fd4ff',fT*.75,1.3);
  segment([0,0,-RE*2.15],[0,0,RE*2.15],'#efe9dc',fT*.6,1.2);
  const pn=proj(0,0,RE*2.15);
  if(pn){g.globalAlpha=fT*.75;g.fillStyle='#8f8878';g.font=(10*devicePixelRatio)+'px Georgia,serif';
   g.fillText('axe des pôles · obliquité '+M.obliq+'°',pn[0]+7*devicePixelRatio,pn[1])}
  anneau(RE*2.0,EU,EV,'#d9b96a',fT*.4,1)}
 // ETAPE 2 — Systeme solaire, plan de l'ecliptique
 const fS=fade(10.5,14.2);
 if(fS>0.01){const p0=proj(0,0,0);
  if(p0){const rg=26*devicePixelRatio*p0[2];
   const gr=g.createRadialGradient(p0[0],p0[1],0,p0[0],p0[1],Math.max(rg,4));
   gr.addColorStop(0,'rgba(255,240,200,.95)');gr.addColorStop(.35,'rgba(232,190,110,.45)');
   gr.addColorStop(1,'rgba(232,190,110,0)');
   g.globalAlpha=fS;g.beginPath();g.arc(p0[0],p0[1],Math.max(rg,4),0,7);g.fillStyle=gr;g.fill()}
  for(let k=1;k<=5;k++)anneau(42*AU*k/5,EU,EV,'#d9b96a',fS*.13,1);
  const lm=Math.log10(30.07*1.5);
  PLAN.forEach((a,k)=>{const rr=(Math.log10(a[0])+1)/(lm+1)*40*AU;
   anneau(rr,EU,EV,k===2?'#7fa3b8':'#b9a880',fS*(k===2?.85:.5),k===2?1.4:1);
   const pp=proj(rr*EU[0],rr*EU[1],rr*EU[2]);
   if(pp){g.globalAlpha=fS;g.fillStyle=k===2?'#7fa3b8':'#8f8878';
    g.beginPath();g.arc(pp[0],pp[1],(k===2?3:2)*devicePixelRatio,0,7);g.fill()}})}
 // ETAPE 3 — Voie lactee, spirale
 const fG=fade(19.0,22.4);
 if(fG>0.01){for(let br=0;br<4;br++)for(let i=0;i<150;i++){
   const t=i/150,rr=(1.2+13.5*t)*KPC,th=br*Math.PI/2+t*2.3;
   const jx=Math.sin(i*12.9898+br)*0.5,jy=Math.cos(i*78.233+br)*0.5;
   const c=Math.cos(th)+jx*0.05,s=Math.sin(th)+jy*0.05;
   const p=proj(rr*(GU[0]*c+GV[0]*s)+jy*0.25*KPC*NGP[0],
                rr*(GU[1]*c+GV[1]*s)+jy*0.25*KPC*NGP[1],
                rr*(GU[2]*c+GV[2]*s)+jy*0.25*KPC*NGP[2]);
   if(!p)continue;g.globalAlpha=fG*(.10+.30*(1-t));g.fillStyle=t<.25?'#f2dfae':'#d9b96a';
   g.beginPath();g.arc(p[0],p[1],(1.6-1.0*t)*devicePixelRatio,0,7);g.fill()}
  for(let k=1;k<=4;k++)anneau(15*KPC*k/4,GU,GV,'#d9b96a',fG*.14,1);
  const ps=proj(GU[0]*8.2*KPC,GU[1]*8.2*KPC,GU[2]*8.2*KPC);
  if(ps){const pu=(Math.sin(Date.now()/420)*.5+.5);
   g.globalAlpha=fG;g.fillStyle='#7fd4ff';g.beginPath();
   g.arc(ps[0],ps[1],(2.6+1.8*pu)*devicePixelRatio,0,7);g.fill();
   g.globalAlpha=fG*.85;g.fillStyle='#cfc8b8';g.font=(10.5*devicePixelRatio)+'px Georgia,serif';
   g.fillText('vous êtes ici · 8,2 kpc ≈ 26 700 al',ps[0]+9*devicePixelRatio,ps[1]+4*devicePixelRatio)}
  const pc=proj(0,0,0);
  if(pc){g.globalAlpha=fG*.9;g.fillStyle='#c96a4a';g.beginPath();
   g.arc(pc[0],pc[1],3.2*devicePixelRatio,0,7);g.fill()}
  anneau(15*KPC,EU,EV,'#7fa3b8',fG*.30,1)}
 // ETAPE 4 — sphere cosmologique
 const fC=obs?1:fade(22.0,30.0);let nSN=0,nFR=0,nVD=0;
 if(fC>0.01){
