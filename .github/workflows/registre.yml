# Registre — la falsification-as-code, en CI.
# Build rouge = un critère pré-enregistré a bougé après gel = conclusion inopposable.
name: registre

on: [push, pull_request]

jobs:
  criteres:
    name: critères gelés (registre.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chaque critère gelé (docstring) est re-hashé et comparé à registre.lock.
      # exit 1 = critère modifié APRÈS gel = build rouge. L'amendement n'est possible que
      # par `freeze --amend`, qui l'écrit publiquement dans RETRACTATIONS.md.
      - name: registre verify
        run: python3 outils/registre.py verify

      # Le sceau DR3. scelle.py scelle ses propres octets (read_bytes) : ce hash est celui
      # publié (README, CONCLUSION.md, réseaux). Il est épinglé ici : toute modification de
      # scelle.py — seuils, verdicts, corps — casse le build. Personne ne touche l'arbitre,
      # nous compris.
      - name: sceau DR3 intact
        run: |
          echo "68d06bcccbecf2276919c05dc841c6d878ca2516427e533af38d64344aed45a2  outils/scelle.py" | sha256sum -c -
          echo "sceau : $(sha256sum outils/scelle.py)"

  reproduction:
    name: ligne de base (β ∈ [2,42 ; 2,60] sur données publiques)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy
      # Pantheon+ (GitHub) + catalogues de vides (Zenodo, CDS) ; SHA256 vérifiés.
      - name: données publiques
        run: sh donnees/TELECHARGER.sh
      # Rejoue vraisemblance_reelle.py : 1580 SNe, β dans la plage publiée, Δχ² < 0.
      # exit 1 = le corpus ne se reproduit plus = build rouge.
      - name: ligne de base
        run: python3 outils/ligne_de_base.py

  perime:
    name: valeurs périmées (outils/valeurs_canoniques.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Le linter de la règle 7 (ATLAS_falsification_spec.md) : un document de façade qui cite
      # une valeur dépréciée sans contexte de rétractation fait rougir le build. Bloquant, comme
      # la spec l'exige. Vert au 23/08 (0 occurrence sur 27 documents).
      - run: python3 outils/perime.py
      # rejouer/greffier/confronteur exécutent de VRAIS scripts du corpus (numpy/scipy) sur
      # les données publiques : ce job a donc besoin du même socle que 'reproduction'.
      # (perime.py ci-dessus est pur-stdlib et tourne sans ce socle.)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # camb : attaque_croker_fond.py -> duel_ccbh -> test_wE_v3 calcule r_d via camb au niveau
      # module (build_rd() l.71). Sans lui, cette seule ancre tombe (les 13 autres = numpy/scipy).
      - run: pip install numpy scipy camb
      - name: données publiques
        run: sh donnees/TELECHARGER.sh
      # Les ancres numériques rejouées (registre run, feuille de route v0.2) : 14 scripts,
      # ~35 s. Un résultat qui cesse de se reproduire = build rouge, pas seulement un
      # critère modifié.
      - name: ancres numériques
        run: python3 outils/rejouer.py
      # Le greffier : schema des tensions (une tension « resolue » sans arbitre nommé d'avance = rouge).
      - name: registre des tensions
        run: python3 outils/greffier.py
      # Le confronteur : 5 paires de calculs indépendants de la même quantité (~2,5 min).
      - name: cohérence croisée
        run: python3 outils/confronteur.py
