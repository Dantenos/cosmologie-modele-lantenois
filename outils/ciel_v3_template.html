<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Cône d'Observation — Pantheon+ vu depuis la Terre</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070a;color:#efe9dc;font:14px/1.55 Georgia,'Times New Roman',serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}
canvas.drag{cursor:grabbing}
#hud{position:fixed;left:22px;top:20px;max-width:390px;z-index:5;pointer-events:none}
h1{font-size:17px;font-weight:normal;letter-spacing:.02em;margin-bottom:2px}
#sub{font-size:11.5px;color:#8f8878;margin-bottom:14px}
#txt{background:rgba(12,12,16,.82);border-left:2px solid #c96a4a;padding:11px 13px;font-size:12.5px}
#txt b{color:#d9b96a;font-weight:normal}
.mono{display:block;margin-top:7px;font:10.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#8f8878}
#steps{position:fixed;left:22px;bottom:22px;z-index:6;display:flex;gap:7px;flex-wrap:wrap}
button{background:rgba(18,18,22,.9);color:#cfc8b8;border:1px solid #3a352c;padding:7px 12px;
 font:12px Georgia,serif;cursor:pointer;transition:.18s}
button:hover{border-color:#8f8878;color:#efe9dc}
button.on{background:#c96a4a;border-color:#c96a4a;color:#15100c}
#scalebar{position:fixed;right:22px;bottom:22px;z-index:6;text-align:right;
 font:11px ui-monospace,Menlo,Consolas,monospace;color:#8f8878}
#scaleval{color:#d9b96a;font-size:13px}
#legend{position:fixed;right:22px;top:20px;z-index:5;text-align:right;font-size:11px;color:#8f8878}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:middle}
#note{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:5;
 font-size:10.5px;color:#6f6a5e;text-align:center;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><h1>Le Cône d'Observation</h1>
<div id="sub">Pantheon+ n'est pas un ciel. C'est un trou et des pinceaux.</div>
<div id="txt"></div></div>
<div id="legend"></div>
<div id="steps"></div>
<div id="scalebar">rayon de vue<div id="scaleval"></div></div>
<div id="note">glisser pour tourner &middot; molette pour zoomer &middot; les nombres affichés sont calculés par <span style="color:#8f8878">outils/genere_ciel_v3.py</span>, jamais écrits à la main</div>
<script>
const SN=__SN__,VD=__VD__,FR=__FR__,M=__MES__;
const MPC=3.0857e22, AU=1.496e11, KPC=3.0857e19, RE=6.371e6;
const NGP=[Math.cos(27.12825*Math.PI/180)*Math.cos(192.85948*Math.PI/180),
           Math.cos(27.12825*Math.PI/180)*Math.sin(192.85948*Math.PI/180),
           Math.sin(27.12825*Math.PI/180)];
function nrm(v){const n=Math.hypot(v[0],v[1],v[2]);return[v[0]/n,v[1]/n,v[2]/n]}
function crs(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
const GU=nrm(crs(NGP,[0,0,1])), GV=nrm(crs(NGP,GU));   // base du plan galactique
const PLAN=[["Mercure",.387],["Vénus",.723],["Terre",1],["Mars",1.524],
            ["Jupiter",5.203],["Saturne",9.537],["Uranus",19.19],["Neptune",30.07]];
const ETAPES=[
 {n:"1 · Terre",       r:2.2*RE,      t:"<b>r = 0.</b> L'observateur. Tout ce qui suit est vu d'ici, et c'est la seule raison pour laquelle le ciel a la forme qu'il a.<span class='mono'>rayon terrestre 6 371 km</span>"},
 {n:"2 · Système solaire", r:45*AU,   t:"Huit orbites, <b>échelle logarithmique</b> — sinon Mercure et Neptune ne tiennent pas dans la même image. Aucune supernova de l'échantillon n'est ici : la plus proche est un million de fois plus loin.<span class='mono'>rayon affiché 45 UA · orbites en rayon log</span>"},
 {n:"3 · Voie lactée",  r:26*KPC,     t:"Le disque galactique, et le Soleil à <b>8,2 kpc</b> du centre. C'est ce disque qui va trouer le ciel : sa poussière éteint tout ce qui se trouve derrière.<span class='mono'>disque 15 kpc de rayon · plan orienté par le pôle nord galactique (RA 192,86 ; Dec +27,13)</span>"},
 {n:"4 · Sphère cosmologique", r:0,   t:""}];
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,S,rx=-.32,ry=.5,vx=0,vy=.0013,drag=false,px=0,py=0;
let etape=3, Rview=0, Rcible=0;
const RCOS=M.dmax*1.12*MPC;
ETAPES[3].r=RCOS;
ETAPES[3].t="<b>"+M.n_sn+" supernovae</b>, "+M.n_void+" vides, "+M.n_frb+" sursauts radio. "+
 "Regarde le plan galactique : <b>"+M.n5+" SNe</b> à |b| &lt; 5° là où l'isotropie en veut "+
 Math.round(M.att5)+" — et le pinceau clair, c'est <b>SDSS Stripe 82</b> : "+M.n82+" SNe, "+
 M.pc82+" % de l'échantillon sur "+M.aire82+" % du ciel."+
 "<span class='mono'>évitement : "+M.n10+" SNe à |b|&lt;10° pour "+Math.round(M.att10)+" attendues ("+M.sig10+"σ)<br>"+
 "Stripe 82 : ×"+M.fac82+" la densité isotrope · z médian "+M.zmed82+" contre "+M.zmed+" ailleurs<br>"+
 "géométrie fiducielle déclarée : ΛCDM plat Ω_m = "+M.om+", H₀ = "+M.h0+" — PAS le modèle étudié</span>";
Rview=Rcible=ETAPES[3].r;
function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
 S=Math.min(W,H)*0.40}
addEventListener('resize',rs);rs();
cv.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;cv.classList.add('drag')};
addEventListener('pointerup',()=>{drag=false;cv.classList.remove('drag')});
addEventListener('pointermove',e=>{if(!drag)return;
 vy=(e.clientX-px)*.0022;vx=(e.clientY-py)*.0022;ry+=vy;rx+=vx;px=e.clientX;py=e.clientY});
cv.onwheel=e=>{e.preventDefault();Rcible*=Math.exp(e.deltaY*.0011)};
function rot(x,y,z){const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
 const X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y*cx-Z*sx,Z2=y*sx+Z*cx;return[X,Y,Z2]}
const CAM=2.45,FOC=1.75;
function proj(x,y,z){const[X,Y,Z]=rot(x/Rview,y/Rview,z/Rview);
 const d=CAM-Z; if(d<0.06)return null;
 const s=FOC/d; return[W/2+X*s*S,H/2-Y*s*S,s,Z]}
function fade(a,b){ // 1 quand Rview est dans [a,b] en decades, 0 dehors
 const l=Math.log10(Rview);return Math.max(0,Math.min(1,(l-a)/0.55))*Math.max(0,Math.min(1,(b-l)/0.55))}
function disque(rayon,col,alpha,nseg){g.beginPath();
 for(let i=0;i<=nseg;i++){const t=i/nseg*2*Math.PI,c=Math.cos(t),s=Math.sin(t);
  const p=proj(rayon*(GU[0]*c+GV[0]*s),rayon*(GU[1]*c+GV[1]*s),rayon*(GU[2]*c+GV[2]*s));
  if(!p){g.closePath();return}i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
 g.closePath();g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=devicePixelRatio;g.stroke()}
function bandeGal(rayon,degres,col,alpha){ // cone d'evitement : |b| < degres
 const tb=Math.tan(degres*Math.PI/180);
 for(const sgn of[1,-1]){g.beginPath();let ok=true;
  for(let i=0;i<=72;i++){const t=i/72*2*Math.PI,c=Math.cos(t),s=Math.sin(t);
   const u=[GU[0]*c+GV[0]*s,GU[1]*c+GV[1]*s,GU[2]*c+GV[2]*s];
   const v=nrm([u[0]+sgn*tb*NGP[0],u[1]+sgn*tb*NGP[1],u[2]+sgn*tb*NGP[2]]);
   const p=proj(v[0]*rayon,v[1]*rayon,v[2]*rayon);if(!p){ok=false;break}
   i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  if(ok){g.closePath();g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=devicePixelRatio;g.stroke()}}}
function pinceau82(rayon){ // |Dec| < 1,25 deg, RA hors [60 ; 300]
 g.globalAlpha=.30;g.fillStyle='#d9b96a';g.strokeStyle='#d9b96a';g.lineWidth=devicePixelRatio;
 for(const[a0,a1]of[[300,360],[0,60]]){g.beginPath();let ok=true;const pts=[];
  for(let i=0;i<=24;i++){const A=(a0+(a1-a0)*i/24)*Math.PI/180;
   for(const d of[1.25,-1.25]){const D=d*Math.PI/180;
    pts.push([Math.cos(D)*Math.cos(A)*rayon,Math.cos(D)*Math.sin(A)*rayon,Math.sin(D)*rayon])}}
  const hi=pts.filter((_,k)=>k%2===0),lo=pts.filter((_,k)=>k%2===1).reverse();
  const all=hi.concat(lo);
  for(let k=0;k<all.length;k++){const p=proj(all[k][0],all[k][1],all[k][2]);
   if(!p){ok=false;break}k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  if(ok){g.closePath();g.globalAlpha=.13;g.fill();g.globalAlpha=.55;g.stroke()}}}
function fr(){requestAnimationFrame(fr);
 if(!drag){vy*=.985;vx*=.985;vy+=(0.0011-vy)*.012;ry+=vy;rx+=vx}
 Rview+=(Rcible-Rview)*0.055;
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#07070a';g.fillRect(0,0,W,H);
 const L=Math.log10(Rview);
 // --- Terre
 const fT=fade(6.0,8.6);
 if(fT>0.01){const p=proj(0,0,0);if(p){const r=RE/Rview*p[2]*S;
  const grd=g.createRadialGradient(p[0]-r*.3,p[1]-r*.3,r*.1,p[0],p[1],r*1.02);
  grd.addColorStop(0,'#4a7fa8');grd.addColorStop(.7,'#22475f');grd.addColorStop(1,'#0d1d28');
  g.globalAlpha=fT;g.beginPath();g.arc(p[0],p[1],Math.max(r,1.5),0,7);g.fillStyle=grd;g.fill()}}
 // --- Systeme solaire (rayons logarithmiques, declare)
 const fS=fade(10.5,14.2);
 if(fS>0.01){const lmax=Math.log10(30.07*1.5);
  PLAN.forEach(([nom,aAU],k)=>{const rr=(Math.log10(aAU)+1.0)/(lmax+1.0)*40*AU;
   g.globalAlpha=fS*.5;g.strokeStyle='#7fa3b8';g.lineWidth=devicePixelRatio;g.beginPath();
   let ok=true;for(let i=0;i<=64;i++){const t=i/64*2*Math.PI;
    const p=proj(rr*Math.cos(t),rr*Math.sin(t)*.94,rr*Math.sin(t)*.34);
    if(!p){ok=false;break}i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
   if(ok){g.closePath();g.stroke();
    const pp=proj(rr,0,0);if(pp){g.globalAlpha=fS;g.fillStyle=k===2?'#7fa3b8':'#8f8878';
     g.beginPath();g.arc(pp[0],pp[1],(k===2?3:2)*devicePixelRatio,0,7);g.fill()}}})}
 // --- Voie lactee
 const fG=fade(19.0,22.4);
 if(fG>0.01){for(let k=1;k<=6;k++){disque(15*KPC*k/6,'#d9b96a',fG*.20,80)}
  const ps=proj(GU[0]*8.2*KPC,GU[1]*8.2*KPC,GU[2]*8.2*KPC);
  if(ps){g.globalAlpha=fG;g.fillStyle='#efe9dc';g.beginPath();
   g.arc(ps[0],ps[1],2.5*devicePixelRatio,0,7);g.fill()}}
 // --- cone d'evitement + pinceau, a l'echelle cosmologique
 const fC=fade(22.6,27.5);
 if(fC>0.01){
  bandeGal(RCOS*.98,10,'#c96a4a',fC*.42);
  bandeGal(RCOS*.98,5,'#c96a4a',fC*.24);
  g.globalAlpha=1;pinceau82(RCOS*.98);
  // --- vides
  for(let i=0;i<VD.length;i+=4){const p=proj(VD[i]*MPC,VD[i+1]*MPC,VD[i+2]*MPC);if(!p)continue;
   const r=VD[i+3]*MPC/Rview*p[2]*S;if(r<0.4)continue;
   g.globalAlpha=fC*.30;g.strokeStyle='#5f7f6a';g.lineWidth=devicePixelRatio;
   g.beginPath();g.arc(p[0],p[1],r,0,7);g.stroke()}
  // --- FRB
  for(let i=0;i<FR.length;i+=4){const p=proj(FR[i]*MPC,FR[i+1]*MPC,FR[i+2]*MPC);if(!p)continue;
   g.globalAlpha=fC*(.35+.5*FR[i+3]);g.fillStyle='#a98fc0';
   g.beginPath();g.arc(p[0],p[1],(1.6+2.6*FR[i+3])*devicePixelRatio,0,7);g.fill()}
  // --- SNe
  for(let i=0;i<SN.length;i+=4){const p=proj(SN[i]*MPC,SN[i+1]*MPC,SN[i+2]*MPC);if(!p)continue;
   const f=SN[i+3],s82=f&1,vd=f&2;
   g.globalAlpha=fC*(s82?.95:.55);
   g.fillStyle=s82?'#d9b96a':(vd?'#7fa3b8':'#cfc8b8');
   g.beginPath();g.arc(p[0],p[1],(s82?1.5:1.1)*devicePixelRatio,0,7);g.fill()}}
 // --- barre d'echelle
 const u=Rview>1e23?[Rview/MPC,'Mpc']:Rview>1e19?[Rview/KPC,'kpc']:Rview>1e10?[Rview/AU,'UA']:[Rview/1e3,'km'];
 document.getElementById('scaleval').textContent=u[0].toPrecision(3)+' '+u[1];
}
function setEtape(k){etape=k;Rcible=ETAPES[k].r;
 document.getElementById('txt').innerHTML=ETAPES[k].t;
 [...document.querySelectorAll('#steps button')].forEach((b,i)=>b.classList.toggle('on',i===k))}
ETAPES.forEach((e,k)=>{const b=document.createElement('button');b.textContent=e.n;
 b.onclick=()=>setEtape(k);document.getElementById('steps').appendChild(b)});
document.getElementById('legend').innerHTML=
 "SNe Stripe 82 <i style='background:#d9b96a'></i><br>SNe avec vide sur la visée <i style='background:#7fa3b8'></i><br>"+
 "autres SNe <i style='background:#cfc8b8'></i><br>vides <i style='background:#5f7f6a'></i><br>"+
 "sursauts radio <i style='background:#a98fc0'></i><br>"+
 "<span style='color:#c96a4a'>—</span> cône d'évitement galactique (|b| = 5° et 10°)";
setEtape(3);fr();
</script></body></html>
