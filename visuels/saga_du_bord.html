<!DOCTYPE html><html><head><meta charset="utf-8"><title>La saga du bord</title></head><body style="margin:0;background:#0d0c0a"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 754" font-family="Georgia,serif"><rect width="760" height="754" fill="#0d0c0a"/><text x="40" y="40" fill="#efe9dc" font-size="22" letter-spacing="3">LA SAGA DU SECTEUR DU BORD — six cycles, 24 heures</text><line x1="70" y1="88" x2="70" y2="162" stroke="#6f6a5e" stroke-width="2"/><circle cx="70" cy="80" r="16" fill="#efe9dc" stroke="#141210" stroke-width="2"/><text x="70" y="85" fill="#141210" font-size="11" text-anchor="middle" font-family="monospace">124</text><text x="110" y="85" fill="#cfc8b8" font-size="14">La clé de voûte : dv/dt = 1/(1−x−s), grille κ(x₀,s₀)</text><line x1="70" y1="180" x2="70" y2="254" stroke="#6f6a5e" stroke-width="2"/><circle cx="70" cy="172" r="16" fill="#c9b458" stroke="#141210" stroke-width="2"/><text x="70" y="177" fill="#141210" font-size="11" text-anchor="middle" font-family="monospace">129</text><text x="110" y="177" fill="#cfc8b8" font-size="14">Doute n°2 consigné, avec son juge : « la condition de flux »</text><line x1="70" y1="272" x2="70" y2="346" stroke="#6f6a5e" stroke-width="2"/><circle cx="70" cy="264" r="16" fill="#8B2500" stroke="#141210" stroke-width="2"/><text x="70" y="269" fill="#efe9dc" font-size="11" text-anchor="middle" font-family="monospace">130</text><text x="110" y="269" fill="#cfc8b8" font-size="14">Flux calculé : ε_c = 2,3-4,5 → « la clé tient » RÉTROGRADÉ en branche</text><line x1="70" y1="364" x2="70" y2="438" stroke="#6f6a5e" stroke-width="2"/><circle cx="70" cy="356" r="16" fill="#efe9dc" stroke="#141210" stroke-width="2"/><text x="70" y="361" fill="#141210" font-size="11" text-anchor="middle" font-family="monospace">131</text><text x="110" y="361" fill="#cfc8b8" font-size="14">Friction de Hubble : domaine v₀ ≲ x/3 — « refermé »</text><line x1="70" y1="456" x2="70" y2="530" stroke="#6f6a5e" stroke-width="2"/><circle cx="70" cy="448" r="16" fill="#8B2500" stroke="#141210" stroke-width="2"/><text x="70" y="453" fill="#efe9dc" font-size="11" text-anchor="middle" font-family="monospace">132</text><text x="110" y="453" fill="#cfc8b8" font-size="14">Audit : DÉPLACÉ, pas résolu. Racine = idéalisation nulle. Poussière continue, bande basse tension</text><line x1="70" y1="548" x2="70" y2="622" stroke="#6f6a5e" stroke-width="2"/><circle cx="70" cy="540" r="16" fill="#efe9dc" stroke="#141210" stroke-width="2"/><text x="70" y="545" fill="#141210" font-size="11" text-anchor="middle" font-family="monospace">133</text><text x="110" y="545" fill="#cfc8b8" font-size="14">Horloge v1 : γ(v_ff) ; « x₀ ≲ 0,65 »</text><circle cx="70" cy="632" r="16" fill="#3a5f3a" stroke="#141210" stroke-width="2"/><text x="70" y="637" fill="#efe9dc" font-size="11" text-anchor="middle" font-family="monospace">134</text><text x="110" y="637" fill="#cfc8b8" font-size="14">Contraction GR : formule exacte. Borne 0,30 RÉHABILITÉE. β₁ = sonde du rayon</text><text x="40" y="734" fill="#6f6a5e" font-size="11" font-family="monospace">ivoire = posé · or = doute pré-consigné · cire = tué/renversé · vert = état final réhabilité — chaque flèche est une entrée du registre</text></svg></body></html>
