<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Le mur des rétractations</title>
<style>body{margin:0;background:#0d0c0a;color:#efe9dc;font-family:Georgia,serif;padding:28px}
h1{font-weight:normal;letter-spacing:.08em;font-size:22px}
.b{display:inline-block;margin:0 6px 18px 0;padding:5px 12px;border:1px solid #6f6a5e;cursor:pointer;font-size:12px;color:#cfc8b8}
.b.on{background:#efe9dc;color:#141210}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.v{border:1px solid #2a2722;padding:10px;font-size:11.5px;line-height:1.45;position:relative;background:#14120f}
.v .n{font-family:monospace;color:#8f8878;font-size:10px}
.v .c{color:#e0d6c2;margin:4px 0}
.v .d{color:#9a9385}
.v.rouge::after{content:"RETIRÉ";position:absolute;top:8px;right:8px;color:#c96a4a;border:1.5px solid #c96a4a;padding:1px 6px;font-size:9px;transform:rotate(6deg);font-family:monospace}
.v.vert::after{content:"ATTAQUE JUSTE";position:absolute;top:8px;right:8px;color:#7da87d;border:1.5px solid #7da87d;padding:1px 6px;font-size:9px;transform:rotate(-4deg);font-family:monospace}
#c{color:#8f8878;font-size:12px;margin-bottom:14px;font-family:monospace}</style></head><body>
<h1>LE MUR DES RÉTRACTATIONS</h1>
<div id="c"></div>
<div><span class="b on" data-f="tous">tous</span><span class="b" data-f="rouge">retirés</span><span class="b" data-f="vert">attaques justes</span></div>
<div id="g"></div>
<script>const R=[{"n": "1", "c": "« Levier de calibration : ±40 mmag = 30 unités de χ², systématique *plausible* »", "v": "**PARTIELLEMENT FAUSSE ALERTE**", "k": "rouge"}, {"n": "2", "c": "« Le modèle nul achète la moitié du signal (−2,40) »", "v": "**FAUSSE ALERTE (double comptage)**", "k": "rouge"}, {"n": "3", "c": "« F_AP : notre modèle à −1,7σ »", "v": "**VRAIE DÉFAITE**", "k": "neutre"}, {"n": "4", "c": "« La fenêtre de coïncidence est rétrécie de 1,5× : défaite »", "v": "**FAUSSE ALERTE (mon erreur)**", "k": "rouge"}, {"n": "5", "c": "« Le gain de forme survivant = juste la préférence BAO (−2,38 ≈ −2,43) »", "v": "**VRAIE STRUCTURE**", "k": "neutre"}, {"n": "6", "c": "« Notre D_H est plus proche → avantage Lyα »", "v": "**FAUSSE (mon erreur)**", "k": "rouge"}, {"n": "7", "c": "« L'étude du modèle nul est déjà publiée »", "v": "**VRAI**", "k": "neutre"}, {"n": "8", "c": "« Toussaint et al. »", "v": "**VRAIE ERREUR, de moi**", "k": "neutre"}, {"n": "9", "c": "« Capital rétrogradé : la dépréciation est dérivée des durées de vie (entrelacement PIM) »", "v": "**RAISON FAUSSE, conclusion maintenue**", "k": "rouge"}, {"n": "10", "c": "« Risque PIM sur la ligne cellule fondatrice »", "v": "**VRAI**", "k": "neutre"}, {"n": "11", "c": "« Hibernation : bouclage non démontré, grille [0,67 ; 4] »", "v": "**VRAI**", "k": "neutre"}, {"n": "12", "c": "« Rail M4 : 2 bords externes seulement »", "v": "**VRAI**", "k": "neutre"}, {"n": "13", "c": "« La viabilité de β fournit une contre-pression sur Ω_m que Smolin n'a pas »", "v": "**FAUSSE comme solution.** La contre-pression existe mais porte le même signe que la pression (dlnM_cut/dlnΩ_m = −2,61) : elle aggrave la fuite au lieu de l'opposer.", "k": "rouge"}, {"n": "14", "c": "« dlnN/dlnΩ_m = +ν² ≈ 6,2 »", "v": "**FAUSSE comme chiffre.** Formule de queue exponentielle appliquée hors de la queue. Le seuil auto-cohérent donne ν = 0,89, et le gradient complet vaut +3,8.", "k": "rouge"}, {"n": "15", "c": "« σ₈ observé siège au maximum de fécondité » (tentation, non publiée)", "v": "**REFUSÉE avant publication.** L'argmax glisse de 0,88 à 3,0 avec le seuil : c'est une propriété du seuil, pas du monde.", "k": "neutre"}, {"n": "16", "c": "« l'unimodulaire ne moyenne rien, donc rien ne mange le terme d'injection »", "v": "**FAUSSE** (Jiroušek 2023 : la résolution repose sur une contrainte globale de 4-volume).", "k": "rouge"}, {"n": "17", "c": "« la séquestration est exclue »", "v": "**TROP FORTE** : vraie de la version globale, fausse en général (formulation locale, KPSZ 2016).", "k": "rouge"}, {"n": "18", "c": "« elle annulerait 104,5 % du signal »", "v": "**FAUSSE** : j'ai moyenné ρ_de au lieu de ⟨T⟩/4. Le bon calcul donne 1,41 ρ_de,0 → dégénérescence, pas effacement.", "k": "rouge"}, {"n": "19", "c": "« vérification : π³ = 31,0 observé contre 31,0 attendu »", "v": "**CIRCULAIRE** : le rapport est automatique. Preuve remplacée (33-44 % vs facteurs 41-45).", "k": "neutre"}, {"n": "20", "c": "« +4,00 à amplitude primordiale fixe »", "v": "**MAL POSÉE** : sans pivot ni croissance. Refaite : +3,70.", "k": "rouge"}, {"n": "21", "c": "« refaire tourner Γ ∝ 1/t avec w_E libre : peu coûteux et décisif »", "v": "**À MOITIÉ FAUSSE.** Peu coûteux, oui. Décisif, non : le pipeline reproductible ne retrouve pas l'exclusion publiée même dans leur propre famille (0,03 au lieu de 4,7σ). Test sous-dimensionné.", "k": "rouge"}, {"n": "22", "c": "premier Δχ² = −6,73 pour SN+BAO (contre −4,41 au corpus)", "v": "**BUG DE GRILLE**, attrapé par le contrôle contre un résultat connu. D_c(0) ≠ 0 décalait toutes les distances à bas z. L'erreur allait **dans mon sens**.", "k": "neutre"}, {"n": "23", "c": "« leur 4,7σ est un effet profil-contre-marginalisation » (mon hypothèse du 20/08)", "v": "**RÉFUTÉE par MCMC** : marginalisé, j'obtiens w_E = −1,12 (+1,41/−1,27), toujours 0,8σ. Bonne intuition, mauvaise cause.", "k": "rouge"}, {"n": "24", "c": "« leur coupure à z = 3 explique l'écart »", "v": "**RÉFUTÉE** : avec la coupure, 0,28σ. Pire, pas mieux.", "k": "rouge"}, {"n": "25", "c": "« le manque vient de la précision du CMB comprimé »", "v": "**RÉFUTÉE** : avec R, l_A, ω_b corrélés (l_A à 0,03 %), toujours 0,54σ.", "k": "rouge"}, {"n": "26", "c": "papier B : accord k_eff avec Farrah « à 0,1σ »", "v": "**FAUX** : 0,35 à 0,72σ selon la convention de moyenne. Surévalué d'un facteur 3-7.", "k": "rouge"}, {"n": "27", "c": "papier B : « the one cross-level prediction no other framework makes »", "v": "**FAUX** : les CCBH font la même chose, et Croker et al. 2024 reproduisent DESI. Rival direct manquant.", "k": "rouge"}, {"n": "28", "c": "papier B : Farrah « contested » (Mistele seul)", "v": "**INSUFFISANT** : cinq contraintes indépendantes défavorables non citées.", "k": "rouge"}, {"n": "29", "c": "papier A : PC2 = « la famille à taux constant »", "v": "**FAUX** : PC2 est Γ ∝ H ; PC3 est le taux constant.", "k": "rouge"}, {"n": "30", "c": "papier A : « weak positive Bayesian evidence »", "v": "**IMPRÉCIS** : non concluante pour deux des quatre lois.", "k": "neutre"}, {"n": "31", "c": "ma correction « Farrah : 0,35-0,72σ et non 0,1σ »", "v": "**SUR-CORRECTION** : je recalculais −3w quand Farrah mesure un rapport de croissance de masse. Le 0,1σ d'origine était juste, mal justifié.", "k": "vert"}, {"n": "32", "c": "corpus : « fσ8, le canal de falsification le plus propre »", "v": "**VRAI EN PRINCIPE, FAUX EN PRATIQUE** : 0,8σ à 5 % par point. Retiré de A.", "k": "rouge"}, {"n": "33", "c": "corpus : « M_acc/M_tot = Ω_de, accord 0,4 % »", "v": "**IDENTITÉ** : écart numérique 0,00e+00. Contrôle interne, pas prédiction.", "k": "neutre"}, {"n": "34", "c": "mon premier calcul de croissance", "v": "**BUG** : (3+dlnH/dlna) au lieu de (2+dlnH/dlna). f(0)=0,32 au lieu de 0,52.", "k": "neutre"}, {"n": "35", "c": "papier B : β = 4/(n_eff+3)", "v": "**FACTEUR 2 TROP GRAND**. Littérature (HS85, profil de pic ~ ξ) et données (running) convergent sur 2/(n_eff+3).", "k": "neutre"}, {"n": "36", "c": "mon « les données excluent β = 4/(n+3) à Δχ² ≥ 7,5 » (20/08)", "v": "**CONDITIONNEL** : supposait une horloge en loi de puissance. Avec κ libre, absorbé. L'argument littérature tient, l'argument données non.", "k": "neutre"}, {"n": "37", "c": "mon « personne n'a utilisé la convexité de S comme principe générateur »", "v": "**FAUX** : Pavón & Radicella depuis 2010 ; arXiv:2202.03300 le fait pour paramétrer l'énergie noire ; arXiv:2608.10495, publié la semaine dernière, fait le programme complet.", "k": "rouge"}, {"n": "38", "c": "mon « d²S/dt² a déjà rebasculé positif aujourd'hui, donc le modèle échoue »", "v": "**MAUVAIS TEST** : le critère publié s'évalue en z → −1, pas au présent. La conclusion tient quand même, mais pour une autre raison.", "k": "neutre"}, {"n": "39", "c": "mon « ça te sépare de ΛCDM »", "v": "**VRAI MAIS NON SPÉCIFIQUE** : ça sépare ΛCDM de *tout* w > −1 asymptotique, quintessence comprise. Version thermodynamique de « Λ est spéciale ».", "k": "neutre"}, {"n": "40", "c": "mes fourchettes de β₁ (−0,23/−0,40 et −0,9/−1,6)", "v": "**FAUSSES** : dn_eff/dlnM évalué à des masses arbitraires au lieu de la masse-graine propre à chaque lecture. Valeurs correctes : −0,478 et −0,676.", "k": "rouge"}, {"n": "41", "c": "« le running discrimine les deux lectures »", "v": "**FAUX** : elles diffèrent de 0,198 contre σ = 0,31, soit 0,64σ. Il faudrait σ = 0,066.", "k": "rouge"}, {"n": "42", "c": "mon « durée de vie de la phase viable : sortie à 1,3×10⁴ Ga »", "v": "**FAUX** : extrapolation de l'EDO au-delà de t_end = 16-36 Ga, où β tombe à 0 d'un coup. Il n'y a qu'une horloge de fin.", "k": "rouge"}, {"n": "43", "c": "mon « manquement neuf : deux horloges à réconcilier »", "v": "**INEXISTANT** : conséquence de l'erreur ci-dessus.", "k": "neutre"}, {"n": "40", "c": "mon « ce calcul transformerait β₁ en test propre et", "v": "κ", "k": "neutre"}, {"n": "41", "c": "mon « CCBH est à 4,8-5,9σ du recensement baryonique FRB » (22/08)", "v": "**RETIRÉ**. (a) La DM est une intégrale qui pèse le passé, où CCBH a encore ses baryons : 5,9 → 5,4σ. (b) Surtout, mon s = 0,615 était gonflé par mon approximation du taux stellaire ; à leur s = 0,70 publié, c'est **1,7σ** et absorbable par f_d = 0,97.", "k": "rouge"}, {"n": "42", "c": "mon « 1,7σ, le test ne conclut pas » (23/08 matin)", "v": "**FAUX AUSSI** : ce contrôle avait H₀ = 63,71, hors de leur cosmologie. Calibré correctement sur leur triplet publié, c'est 4,0σ.", "k": "rouge"}, {"n": "43", "c": "mon « f_d ≈ 0,85 supposé » et « Ω_b = 0,0490 ± 0,0035 »", "v": "**REMPLACÉS** par les valeurs publiées : Ω_b h₇₀ = 0,049 ± 0,003, f_IGM = 0,80, f_X = 0,11, prior f_IGM+f_X ≤ 1. Le test passe de 4,0σ à 4,9σ et cesse de reposer sur une hypothèse à moi.", "k": "neutre"}, {"n": "44", "c": "mon « CCBH gagne d'un point d'AIC »", "v": "**NON ROBUSTE** : vrai seulement si la normalisation du taux stellaire n'est pas comptée. Comptée, l'ordre s'inverse. Déclaré.", "k": "neutre"}, {"n": "45", "c": "mon « CCBH à 4,9σ du recensement FRB » (23/08)", "v": "**RÉDUIT À 2,1σ** par la vraisemblance complète : les nuisances, surtout l'hôte, absorbent l'essentiel. Le 4,9σ supposait les nuisances figées. Troisième version de ce test, et la première qui refitte ce qu'il faut refitter.", "k": "neutre"}, {"n": "46", "c": "corpus : « croisement à z = 0,463 » (annoncé partout, 3 fois dans le papier A)", "v": "**RETIRÉ** : valeur pour β = 2,42 seulement ; sur la plage mesurée le croisement va de 0,458 à 0,214. Facteur 2 pour 7 % sur β.", "k": "rouge"}, {"n": "47", "c": "mon « le croisement est un discriminant entre familles » (proposé ce matin)", "v": "**FAUX** : les quatre familles qui croisent le font entre z = 0,20 et 0,31. Testé avant d'être écrit dans le papier.", "k": "rouge"}, {"n": "48", "c": "mon « le rival IDE a un désavantage direct sur nous via S₈ » (23/08 matin)", "v": "**SURÉVALUÉ** : KiDS-Legacy est remonté à 0,815, où nous sommes à 0,6σ et un rival à 0,79 serait à 1,4σ. L'avantage dépend du relevé. Écrit sur une image de la tension vieille de trois ans.", "k": "neutre"}, {"n": "46", "c": "mon « Δχ² croît avec N, donc 142 sursauts pour 3σ »", "v": "**INCOMPLET** : supposait tous les sursauts équivalents. Le pouvoir vient du levier en z. 82 bien choisis, 239 mal choisis, et **zéro** si tous à haut z.", "k": "neutre"}, {"n": "47", "c": "mon « la dégénérescence hôte/cosmologie explique le levier » présenté comme neuf", "v": "**CONNU** : décrit dans la littérature comme la limitation dominante de la cosmologie FRB. Crédité avant publication cette fois.", "k": "neutre"}, {"n": "48", "c": "mon σ_host = 0,55 fiduciel", "v": "**FAUX** : mesuré à 0,96 sur 117 sursauts. Mais l'erreur me désavantageait — le corriger fait passer N(3σ) de 123 à 94.", "k": "rouge"}, {"n": "49", "c": "garde-fou « 142 retiré » du 24/08", "v": "**MAL SPÉCIFIÉ** : un saut de ligne l'a fait manquer une occurrence en conclusion. Règle du 19/08 enfreinte.", "k": "neutre"}, {"n": "50", "c": "corpus : « ε ≲ 0,35, une contrainte faible mais réelle »", "v": "**REMPLACÉE** : le canal dynamique (cisaillement sourcé, Koivisto-Mota) donne ε ≲ 2×10⁻⁴. La borne statique manquait le canal dominant ET avait une normalisation douteuse.", "k": "neutre"}, {"n": "51", "c": "ma « théorie de la saturation » (24/08)", "v": "**RÉFUTÉE 1 h après par son propre test** : trois formes arbitraires à +4,5/+5,1 AIC, seuil +4.", "k": "rouge"}, {"n": "52", "c": "mon hypothèse de rechange « c'est la dilution g(t)/a³ »", "v": "**RÉFUTÉE dans la foulée** : +798/+28/+1160.", "k": "rouge"}, {"n": "53", "c": "mes ΔAIC +798 et +1160 (formes diluées)", "v": "**ARTEFACTS** de limite précoce, retirés.", "k": "rouge"}, {"n": "54", "c": "mon hypothèse « la propriété partagée est le croisement fantôme »", "v": "**RÉFUTÉE** : bosse à maximum libre → +29,6.", "k": "rouge"}, {"n": "55", "c": "ma question « quelle propriété étroite partagent-ils ? »", "v": "**MAL POSÉE** : les données mesurent une courbe (σ=1,8 %), pas une propriété.", "k": "rouge"}, {"n": "56", "c": "mon « κ(σ) existe, la clé de voûte tient » (#124-125)", "v": "**RÉTROGRADÉ par mon propre doute #2, exécuté** : ε_c = 2,3-4,5, σ-const non auto-cohérent, κ encadré à ±(0,6-1,2) près. Énoncé de branche, pas prédiction. L'identité cinématique survit (double dérivation + ancre 0,2408).", "k": "rouge"}, {"n": "57", "c": "mon intuition « la pression de création freine la couche »", "v": "**MÉCANISME FAUX DE SIGNE** (une tension ne pousse pas), attrapé en dérivant ; l'identité survit, corrigée en P_ram/", "k": "rouge"}, {"n": "58", "c": "mon « chantier 1 refermé sur domaine v₀ ≲ x/3 » (#131)", "v": "**SUR-ÉNONCÉ, condamné par son propre critère une heure après** : la paroi encaissait encore (1−v₀)Φ sous Vaidya. La racine était l'idéalisation nulle ; le remède (courant de poussière continu) innocente la paroi mais dérive v₀ et réduit le domaine à une bande", "k": "rouge"}, {"n": "59", "c": "corpus : « \", "v": "κ\", "k": "neutre"}, {"n": "60", "c": "ma formule E8 « dτ_p/dt = γ(v_ff) = 1/√((1−s)²−x²) » (#133)", "v": "**FAUSSE** : raccourci SR ayant perdu le terme croisé de la paroi. Exacte : [(1−s)+x·v_ff]/f, vérifiée par contraction GR à 10⁻¹². Pôle d'ordre 1, pas racine.", "k": "rouge"}, {"n": "61", "c": "mon entrée #59 (« x₀ ≲ 0,30 était un artefact de branche ; vrai : 0,65 »)", "v": "**RETIRÉE** : avec la formule exacte, x₀_max = 0,32. La borne historique était juste et ROBUSTE (7 % entre extérieurs). Ma « correction » du corpus est celle qui tombe.", "k": "rouge"}, {"n": "62", "c": "corpus : « le secteur des perturbations décale fσ8 de ~1-2 % » (supposé)", "v": "**CORRIGÉ PAR DÉRIVATION** : la contribution d'agglomération dérivée (δQ=0, création au repos) vaut **+3,7 %** — près du double, et dans la direction DÉFAVORABLE au modèle (S8). Rapporté tel quel ; arbitrage final : E9-CLASS.", "k": "rouge"}, {"n": "63", "c": "mon « les données mesurent f(z) à 1,8 % ; 4,6 % coûte ~6 » (#123, papier C, vidéo)", "v": "**FAUX deux fois** : σ réel = 0,67 % (parabole hors minimum moyennée = malpractice) ; et le mécanisme du nul est DIRECTIONNEL — Δχ²(inter-modèles)=+1,06, une direction quasi-plate, pas une résolution insuffisante. Attrapé par le soupçon d'Ed (« trop beau »), p", "k": "rouge"}];
const g=document.getElementById('g'),c=document.getElementById('c');
c.textContent=`${R.length} entrées de triage — ${R.filter(r=>r.k=='rouge').length} retirées · ${R.filter(r=>r.k=='vert').length} attaques justes — généré depuis TRIAGE_DES_ATTAQUES.md, zéro donnée inventée`;
function render(f){g.innerHTML='';R.filter(r=>f=='tous'||r.k==f).forEach(r=>{
const d=document.createElement('div');d.className='v '+r.k;
d.innerHTML=`<div class="n">entrée ${r.n}</div><div class="c">${r.c}</div><div class="d">${r.v}</div>`;g.appendChild(d)})}
document.querySelectorAll('.b').forEach(b=>b.onclick=()=>{document.querySelectorAll('.b').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.f)});
render('tous');</script></body></html>
