<style>

<canvas id="c"></canvas>
<div id="hud" class="ui"><h1>Le Cône d'Observation <span style="font-size:11px;color:#6f6a5e">· le vide d'information</span></h1>
<div id="sub">Chaque nombre affiché est calculé avant d'être dessiné.</div>
<div id="txt"></div></div>
<div id="panneau" class="ui">
 <div class="grp"><div class="tt">filtres</div><div id="f1"></div></div>
 <div class="grp"><div class="tt">outils</div><div id="f2"></div></div>
 <div class="grp"><div class="tt">repère &amp; capture</div><div id="f3"></div></div>
 <div id="cpt"></div></div>
<div id="zbox" class="ui"><input id="zr" type="range" min="0" max="1000" value="1000"><div id="zlab"></div></div>

<div id="ech" class="ui">rayon de vue<div id="echv"></div><div id="lb"></div></div>
<div id="info" class="ui"></div>
<div id="note" class="ui">glisser pour tourner · molette pour zoomer · survoler pour la ligne de visée · règle céleste : cliquer deux points · coupe : Maj + molette</div>
<script>
const SN=__SN__,VD=__VD__,FR=__FR__,ISO=__ISO__,OMB=__OMB__,AR=__AR__,M=__MES__;
const MPC=3.0857e22,AU=1.495978707e11,KPC=3.0857e19,PC=3.0857e16,RE=6.371e6,LY=9.4607e15,CM=2.99792458e8;
const NGP=M.ngp,GCV=M.gc,PECL=M.pecl,PCEL=[0,0,1],QMAT=M.Q;
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function nrm(v){const n=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/n,v[1]/n,v[2]/n]}
function crs(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
const GU=nrm(crs(NGP,[0,0,1])),GV=nrm(crs(NGP,GU));
const EU=nrm(crs(PECL,[0,0,1])),EV=nrm(crs(PECL,EU));
const QU=nrm(crs(PCEL,[1,0,0])),QV=nrm(crs(PCEL,QU));
const GP=[QMAT[0][0],QMAT[0][1],QMAT[0][2]],GQ=[QMAT[1][0],QMAT[1][1],QMAT[1][2]];
// axe-angle de la rotation equatorial -> galactique, pour l'animer
const trQ=QMAT[0][0]+QMAT[1][1]+QMAT[2][2];
const ANG=Math.acos(Math.max(-1,Math.min(1,(trQ-1)/2)));
const sA=Math.sin(ANG)||1e-12;
const AXE=nrm([(QMAT[2][1]-QMAT[1][2])/(2*sA),(QMAT[0][2]-QMAT[2][0])/(2*sA),(QMAT[1][0]-QMAT[0][1])/(2*sA)]);
function rodrig(v,t){const th=ANG*t,c=Math.cos(th),s=Math.sin(th),k=AXE,d=dot(k,v),x=crs(k,v);
 return[v[0]*c+x[0]*s+k[0]*d*(1-c),v[1]*c+x[1]*s+k[1]*d*(1-c),v[2]*c+x[2]*s+k[2]*d*(1-c)]}
const PLAN=[[.387],[.723],[1],[1.524],[5.203],[9.537],[19.19],[30.07]];
const RCOS=M.dmax*1.12*MPC;
const cv=document.getElementById('c'),g=cv.getContext('2d'),EL=id=>document.getElementById(id);
let W,H,S,rx=-.32,ry=.5,vx=0,vy=.0012,drag=false,px=0,py=0;
let Rview=RCOS,Rcible=RCOS,obs=false,zmax=M.zmax,mx=-1e9,my=-1e9,hit=null;
let fS82=0,fZOA=0,fISO=0,laser=-1,tour=-1,tourT=0,intro=1,phare=false,cible=null;
let frame=0,frameC=0,radar=-1,clean=false;
let fOMB=0,fGRA=0,plat=0,platC=0,clip=1.01,fCLIP=0,regle=[],vol=-1;
const ETAPES=[["1 · Terre",2.2*RE],["2 · Système solaire",45*AU],["3 · Voie lactée",26*KPC],["4 · Sphère",RCOS]];
const T4="<b>"+M.n_sn+" supernovae</b>, "+M.n_void+" vides, "+M.n_frb+" sursauts radio. Cône rouge : zone d'évitement, <b>"+M.n5+" SNe</b> à |b| &lt; 5° pour "+Math.round(M.att5)+" attendues. Pinceau doré : <b>SDSS Stripe 82</b>, "+M.n82+" SNe ("+M.pc82+" %) sur "+M.aire82+" % du ciel.<span class='mono'>évitement "+M.sig10+"σ · Stripe 82 ×"+M.fac82+" · z médian "+M.zmed82+" contre "+M.zmed+"<br>fiduciaire déclarée ΛCDM plat Ω_m="+M.om+", H₀="+M.h0+" — PAS le modèle étudié</span>";
const TXT=[
 "<b>r = 0.</b> Axe incliné de <b>"+M.obliq+"°</b> (calculé). L'anneau bleu est l'équateur céleste — il définit la déclinaison. L'anneau ambré est l'orbite terrestre : <b>"+M.v_orb+" km/s</b>, dérivée de 2πUA/an. Rotation et révolution fixent ensemble le calendrier des campagnes d'observation au sol.<span class='mono'>obliquité mesurée entre pôle céleste et pôle écliptique (RA 270°, Dec +66,561°)</span>",
 "Disque ambré : le <b>plan de l'écliptique</b>. Le semis extérieur est la <b>ceinture de Kuiper</b> (30–50 UA), qui s'estompe vers le <b>nuage de Oort</b> (2 000 – 100 000 UA, déclaré). C'est la frontière physique du système avant le vide interstellaire.<span class='mono'>rayons logarithmiques · aucune SN du catalogue ici</span>",
 "Spirale à quatre bras, Soleil à <b>8,2 kpc</b> (≈ 26 700 al). La bulle translucide est la <b>Bulle Locale</b> : coquille IRRÉGULIÈRE, entre ~50 et ~150 pc du Soleil selon la direction (cartographie 3D de la poussière). Plan galactique / écliptique : <b>"+M.gal_ecl+"°</b>, calculé.<span class='mono'>dessiner une sphère nette serait faux : la cavité n'en est pas une</span>",T4];
const TPHARE="<b>Phare Sgr A*.</b> Tu regardes le cœur de la galaxie, b = "+M.sgr_b+"° (contrôlé). Dans les 15° autour : <b>"+M.n_sgr+" supernova</b>, pour "+M.att_sgr+" attendues si le ciel était isotrope.<span class='mono'>DEUX causes à ne pas confondre : l'extinction par la poussière ET l'évitement délibéré du plan par les relevés.</span>";
const TOMB="<b>Cônes d’ombre.</b> Chaque disque sombre est une cellule du ciel de "+M.aire_cell+" deg² où <b>aucune</b> supernova n’a été observée. Il y en a "+M.n_omb+" sur "+M.ncell+" : <b>"+M.f_omb+" % du ciel</b>. Un tirage isotrope de même taille n’en laisserait que "+M.f_iso+" ± "+M.s_iso+" %.<span class='mono'>écart mesuré : "+M.sig_omb+"σ · grille d’aire égale (RA uniforme, sin(Dec) uniforme)<br>ce n’est pas l’Univers qui est vide là : c’est nous qui n’y avons pas regardé</span>";
const TGRA="<b>Graphe de proximité</b> — "+M.n_ar+" arêtes, séparation médiane "+M.sep_med+" Mpc. <b>ATTENTION : ce n’est PAS la toile cosmique.</b> Les supernovae sont des traceurs épars et sélectionnés ; relier chacune à sa plus proche voisine dessine <b>où les relevés ont regardé</b>, pas où sont les filaments.<span class='mono'>affiché parce que c’est instructif, étiqueté parce que ce serait faux autrement</span>";
const TVIDE="<b>Traversée du plus grand vide</b> du catalogue Stopyra : le n°"+M.kv+", rayon <b>"+M.rv+" Mpc</b>, centre à "+M.dv+" Mpc. La caméra s’aligne dessus et le traverse.<span class='mono'>rayon et indice calculés, pas choisis à l’œil</span>";
const TRADAR="<b>Scan radar.</b> Une impulsion partie de la Terre, à la vitesse de la lumière. Elle atteint Neptune en 4 h, le bord de la Bulle Locale en 490 ans, Sgr A* en 26 700 ans — et les supernovae les plus lointaines après <b>"+M.t_max+" milliards d'années</b>, sur un univers qui en a "+M.age+".<span class='mono'>regarder loin, c'est regarder tôt · temps calculés dans la fiduciaire déclarée</span>";
function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;S=Math.min(W,H)*0.40}
addEventListener('resize',rs);rs();
cv.onpointerdown=e=>{drag=true;cible=null;px=e.clientX;py=e.clientY;cv.classList.add('drag')};
addEventListener('pointerup',()=>{drag=false;cv.classList.remove('drag')});
cv.addEventListener('click',()=>{if(!hit)return;const i=hit.i;
 if(regle.length>=2)regle=[];
 regle.push([SN[i],SN[i+1],SN[i+2]]);maj()});
addEventListener('pointermove',e=>{mx=e.clientX*devicePixelRatio;my=e.clientY*devicePixelRatio;
 if(!drag)return;vy=(e.clientX-px)*.0022;vx=(e.clientY-py)*.0022;ry+=vy;rx+=vx;px=e.clientX;py=e.clientY});
cv.onwheel=e=>{e.preventDefault();
 if(fCLIP&&e.shiftKey){clip=Math.max(-1.2,Math.min(1.2,clip-e.deltaY*.0012));return}
 if(!obs){radar=-1;Rcible*=Math.exp(e.deltaY*.0011)}};
function rot(x,y,z){if(frameC>1e-4){const v=rodrig([x,y,z],frameC);x=v[0];y=v[1];z=v[2]}
 const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
 const X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y*cx-Z*sx,Z2=y*sx+Z*cx;return[X,Y,Z2]}
const CAM=2.45,FOC=1.75;
function proj(x,y,z){const[X,Y,Z]=rot(x/Rview,y/Rview,z/Rview);
 if(fCLIP&&Z>clip)return null;
 let p=null;
 if(obs){if(Z>=0.02){const s=1.15/Z,r=Math.hypot(X,Y)*s;
   if(r<=2.4)p=[W/2+X*s*S,H/2-Y*s*S,Math.min(1.6,0.5+0.35/Z),Z]}}
 else{const d=CAM-Z;if(d>=0.06){const s=FOC/d;p=[W/2+X*s*S,H/2-Y*s*S,s,Z]}}
 if(platC<1e-3)return p;
 const m=mollweide(nrm([x,y,z]));
 const q=[W/2+m[0]*S*1.15,H/2-m[1]*S*1.15,1,0];
 if(!p)return platC>0.5?q:null;
 const t=platC;return[p[0]*(1-t)+q[0]*t,p[1]*(1-t)+q[1]*t,p[2]*(1-t)+1*t,p[3]*(1-t)]}
function fade(a,b){const l=Math.log10(Rview);
 return Math.max(0,Math.min(1,(l-a)/0.55))*Math.max(0,Math.min(1,(b-l)/0.55))}
function anneau(rr,U,V,col,al,lw,seg){g.beginPath();let ok=true;const N=seg||90;
 for(let i=0;i<=N;i++){const t=i/N*2*Math.PI,c=Math.cos(t),s=Math.sin(t);
  const p=proj(rr*(U[0]*c+V[0]*s),rr*(U[1]*c+V[1]*s),rr*(U[2]*c+V[2]*s));
  if(!p){ok=false;break}i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
 if(ok){g.closePath();g.globalAlpha=al;g.strokeStyle=col;g.lineWidth=(lw||1)*devicePixelRatio;g.stroke()}
 return ok}
function segment(a,b,col,al,lw){const p=proj(a[0],a[1],a[2]),q=proj(b[0],b[1],b[2]);
 if(!p||!q)return;g.globalAlpha=al;g.strokeStyle=col;g.lineWidth=(lw||1)*devicePixelRatio;
 g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
function bandeGal(rr,dg,col,al){const tb=Math.tan(dg*Math.PI/180);
 for(const sg of[1,-1]){g.beginPath();let ok=true;
  for(let i=0;i<=72;i++){const t=i/72*2*Math.PI,c=Math.cos(t),s=Math.sin(t);
   const u=[GU[0]*c+GV[0]*s,GU[1]*c+GV[1]*s,GU[2]*c+GV[2]*s];
   const v=nrm([u[0]+sg*tb*NGP[0],u[1]+sg*tb*NGP[1],u[2]+sg*tb*NGP[2]]);
   const p=proj(v[0]*rr,v[1]*rr,v[2]*rr);if(!p){ok=false;break}
   i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  if(ok){g.closePath();g.globalAlpha=al;g.strokeStyle=col;g.lineWidth=devicePixelRatio;g.stroke()}}}
function pinceau(rr,al){g.strokeStyle='#d9b96a';g.fillStyle='#d9b96a';g.lineWidth=devicePixelRatio;
 for(const[a0,a1]of[[300,360],[0,60]]){const hi=[],lo=[];
  for(let i=0;i<=24;i++){const A=(a0+(a1-a0)*i/24)*Math.PI/180;
   for(const[d,arr]of[[1.25,hi],[-1.25,lo]]){const D=d*Math.PI/180;
    arr.push([Math.cos(D)*Math.cos(A)*rr,Math.cos(D)*Math.sin(A)*rr,Math.sin(D)*rr])}}
  const all=hi.concat(lo.reverse());g.beginPath();let ok=true;
  for(let k=0;k<all.length;k++){const p=proj(all[k][0],all[k][1],all[k][2]);
   if(!p){ok=false;break}k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  if(ok){g.closePath();g.globalAlpha=al*.14;g.fill();g.globalAlpha=al*.6;g.stroke()}}}
function visible(i){const f=SN[i+3],s=f&1,bb=Math.abs(SN[i+5]);
 if(SN[i+4]>zmax)return false;
 if(fS82===1&&!s)return false;if(fS82===2&&s)return false;
 if(fZOA===1&&bb>=10)return false;if(fZOA===2&&bb<10)return false;return true}
function galcoord(d){const b=Math.asin(Math.max(-1,Math.min(1,dot(d,NGP))));
 const p=[d[0]-Math.sin(b)*NGP[0],d[1]-Math.sin(b)*NGP[1],d[2]-Math.sin(b)*NGP[2]];
 let l=Math.atan2(dot(p,GQ),dot(p,GP))*180/Math.PI;if(l<0)l+=360;
 return[l,b*180/Math.PI]}
function mollweide(u){const[l0,b0]=galcoord(u),b=b0*Math.PI/180;
 let l=l0*Math.PI/180;if(l>Math.PI)l-=2*Math.PI;
 let th=b;for(let k=0;k<6;k++){const d=(2*th+Math.sin(2*th)-Math.PI*Math.sin(b))/(2+2*Math.cos(2*th));
  th-=d;if(!isFinite(th))break}
 return[-2*Math.SQRT2/Math.PI*l*Math.cos(th),Math.SQRT2*Math.sin(th)]}
function carte(){const bw=180*devicePixelRatio,bh=bw/2,x0=W-bw-20*devicePixelRatio,y0=H-bh-66*devicePixelRatio;
 g.globalAlpha=.9;g.fillStyle='rgba(10,10,14,.82)';g.fillRect(x0-6,y0-6,bw+12,bh+12);
 g.globalAlpha=.32;g.strokeStyle='#3a352c';g.lineWidth=devicePixelRatio;
 g.beginPath();g.ellipse(x0+bw/2,y0+bh/2,bw/2,bh/2,0,0,7);g.stroke();
 g.globalAlpha=.5;g.strokeStyle='#c96a4a';g.beginPath();
 g.moveTo(x0,y0+bh/2);g.lineTo(x0+bw,y0+bh/2);g.stroke();
 for(let i=0;i<SN.length;i+=6){if(!visible(i))continue;
  const m=mollweide(nrm([SN[i],SN[i+1],SN[i+2]]));
  g.globalAlpha=(SN[i+3]&1)?.95:.45;g.fillStyle=(SN[i+3]&1)?'#d9b96a':'#cfc8b8';
  g.fillRect(x0+bw/2+m[0]*bw/2,y0+bh/2-m[1]*bh/2,1.4*devicePixelRatio,1.4*devicePixelRatio)}
 const mg=mollweide(GCV);g.globalAlpha=.95;g.fillStyle='#c96a4a';
 g.beginPath();g.arc(x0+bw/2+mg[0]*bw/2,y0+bh/2-mg[1]*bh/2,2.4*devicePixelRatio,0,7);g.fill();
 g.globalAlpha=.55;g.fillStyle='#8f8878';g.font=(9*devicePixelRatio)+'px ui-monospace,monospace';
 g.fillText('Mollweide · galactique · ● Sgr A*',x0,y0+bh+13*devicePixelRatio)}
function vise(d){const r=Math.hypot(d[0],d[2]);cible=[Math.atan2(d[1],r),Math.atan2(-d[0],d[2])]}
function tempsLum(r){const t=r/CM;
 if(t<7200)return(t/3600).toFixed(1)+' heures-lumière';
 if(t<3.156e7*2)return(t/86400).toFixed(1)+' jours-lumière';
 if(t<3.156e7*1e3)return(t/3.156e7).toPrecision(3)+' années-lumière';
 if(t<3.156e7*1e6)return(t/3.156e7/1e3).toPrecision(3)+' milliers d’années';
 if(t<3.156e7*1e9)return(t/3.156e7/1e6).toPrecision(3)+' millions d’années';
 return(t/3.156e7/1e9).toPrecision(3)+' milliards d’années'}
function fr(){requestAnimationFrame(fr);
 if(intro>0){intro-=0.0037;Rcible=RCOS*(1+38*Math.max(0,intro)**3)}
 if(tour>=0){tourT+=1/60;if(tourT>22.5){tour=(tour+1)%TOUR.length;lanceTour(tour)}}
 if(radar>=0){radar+=0.0014;if(radar>1){radar=0}}
 frameC+=(frame-frameC)*0.015;platC+=(plat-platC)*0.018;
 if(vol>=0){vol+=0.0016;if(vol>1)vol=-1;}
 if(cible){rx+=(cible[0]-rx)*.018;ry+=(cible[1]-ry)*.018;vx=vy=0;
  if(Math.abs(cible[0]-rx)<1e-3&&Math.abs(cible[1]-ry)<1e-3)cible=null}
 else if(!drag){vy*=.995;vx*=.995;vy+=(0.00037-vy)*.004;ry+=vy;rx+=vx}
 let rScan=0;
 if(vol>=0){const k=M.kv*4,dv=Math.hypot(VD[k],VD[k+1],VD[k+2])*MPC;
  Rcible=Math.max(M.rv*MPC*0.55,dv*Math.abs(1-2*vol)+M.rv*MPC*0.35)}
 if(radar>=0){const l0=Math.log10(3e8),l1=Math.log10(RCOS);
  rScan=Math.pow(10,l0+(l1-l0)*radar);if(!obs)Rcible=rScan*2.6}
 // chemin de camera LOGARITHMIQUE : l'echelle avance en log(r), pas en r
 Rview=Math.exp(Math.log(Rview)+(Math.log(Rcible)-Math.log(Rview))*0.018);
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#07070a';g.fillRect(0,0,W,H);
 const fT=fade(6.0,8.6);
 if(fT>0.01&&!obs){const p=proj(0,0,0);
  if(p){const r=RE/Rview*p[2]*S;
   const gr=g.createRadialGradient(p[0]-r*.35,p[1]-r*.35,r*.08,p[0],p[1],r*1.03);
   gr.addColorStop(0,'#5b93bd');gr.addColorStop(.55,'#255070');gr.addColorStop(1,'#08161f');
   g.globalAlpha=fT;g.beginPath();g.arc(p[0],p[1],Math.max(r,1.5),0,7);g.fillStyle=gr;g.fill()}
  anneau(RE*1.9,QU,QV,'#7fd4ff',fT*.75,1.3);
  segment([0,0,-RE*2.15],[0,0,RE*2.15],'#efe9dc',fT*.6,1.2);
